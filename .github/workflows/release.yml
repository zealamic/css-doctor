name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PNPM_VERSION: 9.0.0
  NODE_VERSION: 24
  ACTIONS_NODE20_DEPRECATION_WARNING: "false"
  CARGO_BUILD_JOBS: 4
  CARGO_INCREMENTAL: 1

jobs:
  # GIAI ĐOẠN 1: Matrix build 5 native platforms
  build-native:
    name: Native ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.runner }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            runner: macos-latest
          - target: x86_64-apple-darwin
            platform: darwin-x64
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
          --filter "@zealamic/*..." --filter "."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Ensure macOS x64 Rust target
        if: matrix.settings.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: binding-${{ matrix.settings.target }}
          cache-on-failure: true

      - name: Install Zig and cargo-zigbuild for musl
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          pipx install ziglang
          pipx install cargo-zigbuild
          pipx ensurepath
          export PATH="$HOME/.local/bin:$PATH"
          sudo ln -sf "$(which python-zig)" /usr/local/bin/zig
          zig version
          cargo-zigbuild --version

      - name: Expose Node and Rust tools on system PATH
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          for tool in node pnpm cargo rustc rustup; do
            tool_path="$(command -v "$tool" || true)"
            if [ -n "$tool_path" ]; then
              sudo ln -sf "$tool_path" "/usr/local/bin/$tool"
            fi
          done

      - name: Build native binding (musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        shell: bash
        env:
          PATH: /home/runner/.local/bin:/home/runner/.cargo/bin:/home/runner/setup-pnpm/node_modules/.bin:/usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          zig version
          pnpm --filter @zealamic/css-doctor-binding build \
            --target "${{ matrix.settings.target }}" \
            --zig

      - name: Build native binding (non-musl)
        if: matrix.settings.target != 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @zealamic/css-doctor-binding build \
            --target "${{ matrix.settings.target }}"

      - name: Verify native output
        shell: bash
        run: |
          set -euo pipefail
          ls -la packages/binding/*.node

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.settings.target }}
          path: packages/binding/*.node
          if-no-files-found: error
          retention-days: 7

  # GIAI ĐOẠN 2: Publish 5 platform bindings + loader trước (có kiểm tra trùng version)
  publish-binding:
    name: Publish Native Bindings
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binding-*
          path: native-binaries
          merge-multiple: true

      - name: Resolve Version & Stage Platform Packages
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_version="${REF_NAME#v}"
          if [ -z "${release_version}" ] \vert{}\vert{} [ "${release_version}" = "main" ]; then
            release_version=$(node -p "require('./packages/binding/package.json').version")
          fi

          if [[ "${release_version}" =~ (alpha|beta|rc) ]]; then
            npm_tag="beta"
          else
            npm_tag="latest"
          fi

          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"
          echo "NPM_TAG=${npm_tag}" >> "$GITHUB_ENV"
          echo "Staging packages with version: ${release_version} and dist-tag:${npm_tag}"

          TARGET_VERSION="${release_version}" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const version = process.env.TARGET_VERSION;
          const targets = [
            "aarch64-apple-darwin",
            "x86_64-apple-darwin",
            "x86_64-unknown-linux-gnu",
            "x86_64-unknown-linux-musl",
            "x86_64-pc-windows-msvc"
          ];
          const platforms = [
            "darwin-arm64",
            "darwin-x64",
            "linux-x64-gnu",
            "linux-x64-musl",
            "win32-x64-msvc"
          ];

          for (let i = 0; i < targets.length; i++) {
            const platform = platforms[i];
            const target = targets[i];
            const packageDir = path.join("packages", "binding", "npm", `css-doctor-binding-${platform}`);
            const binaryName = `css-doctor-binding.${platform}.node`;
            const destBinary = path.join(packageDir, binaryName);

            fs.mkdirSync(packageDir, { recursive: true });

            const binaryFiles = fs.readdirSync("native-binaries");
            const matchedFile = binaryFiles.find((f) => f.includes(platform) && f.endsWith(".node"));
            if (!matchedFile) {
              console.error(`Missing binary for ${platform}`);
              process.exit(1);
            }

            fs.copyFileSync(path.join("native-binaries", matchedFile), destBinary);

            let osName = "linux";
            let cpuName = "x64";
            if (platform.startsWith("darwin")) {
              osName = "darwin";
              cpuName = platform.replace("darwin-", "");
            } else if (platform.startsWith("win32")) {
              osName = "win32";
            }

            const manifest = {
              name: `@zealamic/css-doctor-binding-${platform}`,
              version: version,
              description: `Prebuilt css-doctor native binding for ${platform}`,
              license: "MIT",
              main: binaryName,
              files: [binaryName],
              os: [osName],
              cpu: [cpuName],
              publishConfig: { access: "public" }
            };

            fs.writeFileSync(
              path.join(packageDir, "package.json"),
              `${JSON.stringify(manifest, null, 2)}\n`
            );
            console.log(`Staged ${manifest.name} -> ${manifest.version}`);
          }

          const mainBindingPath = path.join("packages", "binding", "package.json");
          const mainManifest = JSON.parse(fs.readFileSync(mainBindingPath, "utf8"));
          mainManifest.version = version;
          delete mainManifest.private;
          mainManifest.publishConfig = mainManifest.publishConfig ?? {};
          mainManifest.publishConfig.access = "public";
          mainManifest.optionalDependencies = Object.fromEntries(
            platforms.map((p) => [`@zealamic/css-doctor-binding-${p}`, version])
          );
          fs.writeFileSync(mainBindingPath, `${JSON.stringify(mainManifest, null, 2)}\n`);
          console.log(`Updated loader ${mainManifest.name} -> ${mainManifest.version}`);
          NODE

      - name: Configure npm auth
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is missing"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"

      - name: Publish 5 Platform Binaries (Skip if already published)
        shell: bash
        run: |
          set -euo pipefail
          platforms=(
            "darwin-arm64"
            "darwin-x64"
            "linux-x64-gnu"
            "linux-x64-musl"
            "win32-x64-msvc"
          )
          for platform in "${platforms[@]}"; do
            dir="packages/binding/npm/css-doctor-binding-${platform}"
            pkg_name="@zealamic/css-doctor-binding-${platform}"
            
            # Kiểm tra xem package@version đã có trên registry chưa
            if npm view "${pkg_name}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
              echo "⏩ ${pkg_name}@${RELEASE_VERSION} already exists on npm. Skipping publish."
            else
              echo "🚀 Publishing ${dir}..."
              (cd "$dir" && npm publish --access public --tag "${NPM_TAG}" --ignore-scripts)
            fi
          done

      - name: Publish Main Binding Loader (Skip if already published)
        shell: bash
        run: |
          set -euo pipefail
          pkg_name="@zealamic/css-doctor-binding"
          if npm view "${pkg_name}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "⏩ ${pkg_name}@${RELEASE_VERSION} already exists on npm. Skipping publish."
          else
            echo "🚀 Publishing packages/binding..."
            (cd packages/binding && npm publish --access public --tag "${NPM_TAG}" --ignore-scripts)
          fi

  # GIAI ĐOẠN 3: Đợi registry 5s rồi build & publish Adapters + CLI (Skip nếu đã có trên registry)
  publish-ecosystem:
    name: Build & Publish Adapters & CLI
    needs: publish-binding
    runs-on: ubuntu-latest
    steps:
      - name: Wait 5 seconds for npm registry sync
        shell: bash
        run: |
          echo "Pending 5 seconds for npm registry to propagate binding metadata..."
          sleep 5
          echo "Sync delay completed. Proceeding to ecosystem release."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
          --filter "@zealamic/*..." --filter "."

      - name: Resolve Tag & Sync Ecosystem Versions
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_version="${REF_NAME#v}"
          if [ -z "${release_version}" ] \vert{}\vert{} [ "${release_version}" = "main" ]; then
            release_version=$(node -p "require('./packages/binding/package.json').version")
          fi

          if [[ "${release_version}" =~ (alpha|beta|rc) ]]; then
            npm_tag="beta"
          else
            npm_tag="latest"
          fi

          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"
          echo "NPM_TAG=${npm_tag}" >> "$GITHUB_ENV"
          echo "Syncing ecosystem packages to version: ${release_version} (dist-tag:${npm_tag})"

          TARGET_VERSION="${release_version}" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const version = process.env.TARGET_VERSION;

          if (!version) {
            console.error("TARGET_VERSION is missing");
            process.exit(1);
          }

          const packageDirs = [
            "css-doctor-vite",
            "css-doctor-rsbuild",
            "css-doctor-remix",
            "css-doctor-nuxt",
            "css-doctor-next",
            "cli"
          ];

          for (const dir of packageDirs) {
            const manifestPath = path.join("packages", dir, "package.json");
            if (!fs.existsSync(manifestPath)) continue;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            manifest.version = version;
            delete manifest.private;
            manifest.publishConfig = manifest.publishConfig ?? {};
            manifest.publishConfig.access = "public";

            if (manifest.dependencies && manifest.dependencies["@zealamic/css-doctor-binding"]) {
              manifest.dependencies["@zealamic/css-doctor-binding"] = version;
            }
            if (manifest.dependencies && manifest.dependencies["@zealamic/css-doctor-vite"]) {
              manifest.dependencies["@zealamic/css-doctor-vite"] = version;
            }

            fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
            console.log(`Updated ${manifest.name} -> ${manifest.version}`);
          }
          NODE

      - name: Build CLI and adapters
        run: |
          set -euo pipefail
          pnpm --filter @zealamic/css-doctor-cli build
          pnpm --filter @zealamic/css-doctor-vite build
          pnpm --filter @zealamic/css-doctor-rsbuild build
          pnpm --filter @zealamic/css-doctor-remix build
          pnpm --filter @zealamic/css-doctor-nuxt build
          pnpm --filter @zealamic/css-doctor-next build

      - name: Verify CLI bundle
        shell: bash
        run: |
          set -euo pipefail
          test -x packages/cli/dist/index.js
          head -1 packages/cli/dist/index.js | grep -Fx '#!/usr/bin/env node'
          node packages/cli/dist/index.js --help >/dev/null

      - name: Configure npm auth
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >