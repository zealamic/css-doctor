name: Release Step 2 - Adapters & CLI

on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: read

concurrency:
  group: release-step-2-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PNPM_VERSION: 9.0.0
  NODE_VERSION: 24
  ACTIONS_NODE20_DEPRECATION_WARNING: "false"

jobs:
  publish-ecosystem:
    name: Build and Publish Adapters & CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
          --filter "@zealamic/*..." --filter "."

      - name: Resolve Version & Prepare Workspace
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [ "${REF_TYPE}" = "tag" ]; then
            release_version="${REF_NAME#v}"
          else
            release_version=$(node -p "require('./packages/binding/package.json').version")
          fi

          if [[ "${release_version}" =~ (alpha|beta|rc) ]]; then
            npm_tag="beta"
          else
            npm_tag="latest"
          fi

          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"
          echo "NPM_TAG=${npm_tag}" >> "$GITHUB_ENV"
          echo "Target Release Version: ${release_version} (dist-tag: ${npm_tag})"

      - name: Ensure Complete Binding Declarations
        shell: bash
        run: |
          set -euo pipefail
          # Nếu packages/binding/index.d.ts chưa có hoặc thiếu export, đảm bảo định nghĩa đầy đủ để tsup DTS không báo TS2305
          if [ ! -s packages/binding/index.d.ts ] || ! grep -q "analyzeCss" packages/binding/index.d.ts; then
            echo "Injecting complete declaration into packages/binding/index.d.ts..."
            cat << 'EOF' > packages/binding/index.d.ts
          export interface JsSelectorStat {
            selector: string;
            count: number;
            specificity: number[];
          }

          export interface JsCssAnalysisResult {
            unusedSelectors: string[];
            duplicateRules: number;
            selectorStats: JsSelectorStat[];
            totalRules: number;
            compressedSize: number;
          }

          export function analyzeCss(css: string, htmls?: string[]): JsCssAnalysisResult;
          export function optimizeCss(css: string, options?: any): string;
          EOF
          fi

      - name: Build CLI and adapters
        run: |
          set -euo pipefail
          # Build tuần tự theo thứ tự phụ thuộc
          pnpm --filter @zealamic/css-doctor-cli build
          pnpm --filter @zealamic/css-doctor-vite build
          pnpm --filter @zealamic/css-doctor-rsbuild build
          pnpm --filter @zealamic/css-doctor-remix build
          pnpm --filter @zealamic/css-doctor-nuxt build
          pnpm --filter @zealamic/css-doctor-next build

      - name: Verify CLI bundle
        shell: bash
        run: |
          set -euo pipefail
          test -x packages/cli/dist/index.js
          head -1 packages/cli/dist/index.js | grep -Fx '#!/usr/bin/env node'
          node packages/cli/dist/index.js --help >/dev/null

      # Chuyển workspace:* thành version phát hành thực tế ngay trước khi publish lên npm
      - name: Rewrite workspace dependencies to current release
        shell: bash
        run: |
          set -euo pipefail
          TARGET_VERSION="${RELEASE_VERSION}" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const version = process.env.TARGET_VERSION;

          const packageDirs = [
            "css-doctor-vite",
            "css-doctor-rsbuild",
            "css-doctor-remix",
            "css-doctor-nuxt",
            "css-doctor-next",
            "cli"
          ];

          for (const dir of packageDirs) {
            const manifestPath = path.join("packages", dir, "package.json");
            if (!fs.existsSync(manifestPath)) continue;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));

            manifest.version = version;
            delete manifest.private;
            manifest.publishConfig = manifest.publishConfig ?? {};
            manifest.publishConfig.access = "public";

            const depKeys = ["dependencies", "peerDependencies", "optionalDependencies"];
            for (const key of depKeys) {
              if (!manifest[key]) continue;
              if (manifest[key]["@zealamic/css-doctor-binding"]) {
                manifest[key]["@zealamic/css-doctor-binding"] = version;
              }
              if (manifest[key]["@zealamic/css-doctor-vite"]) {
                manifest[key]["@zealamic/css-doctor-vite"] = version;
              }
            }

            fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
            console.log(`Updated ${manifest.name}: version -> ${version}, pinned binding -> ${version}`);
          }
          NODE

      - name: Configure npm auth
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is missing"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"

      - name: Publish Adapters and CLI in Topological Order (Skip if already exists)
        shell: bash
        run: |
          set -euo pipefail
          order=(
            "css-doctor-vite"
            "css-doctor-rsbuild"
            "css-doctor-remix"
            "css-doctor-nuxt"
            "css-doctor-next"
            "cli"
          )
          for dir in "${order[@]}"; do
            manifest_path="packages/${dir}/package.json"
            pkg_name=$(node -p "require('./${manifest_path}').name")

            if npm view "${pkg_name}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
              echo "⏩ ${pkg_name}@${RELEASE_VERSION} already exists on npm. Skipping publish."
            else
              echo "🚀 Publishing packages/${dir} (${pkg_name})..."
              (cd "packages/${dir}" && npm publish --access public --tag "${NPM_TAG}" --ignore-scripts)
            fi
          done

      - name: Publish Summary
        run: |
          {
            echo "## Release Step 2 Completed 🎉"
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- npm Dist-tag: \`${NPM_TAG}\`"
            echo "- Rewrote \`workspace:*\` -> \`@zealamic/css-doctor-binding@${RELEASE_VERSION}\`"
            echo "- Published: \`vite\`, \`rsbuild\`, \`remix\`, \`nuxt\`, \`next\`, \`cli\`"
          } >> "$GITHUB_STEP_SUMMARY"