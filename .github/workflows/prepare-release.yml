name: Prepare release artifacts

# This workflow prepares release artifacts only. It never publishes to npm.
# A maintainer downloads ready-to-publish-packages.zip and publishes manually.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PNPM_VERSION: 9.0.0
  NODE_VERSION: 22
  ACTIONS_NODE20_DEPRECATION_WARNING: "false"

jobs:
  build-native:
    name: Native ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.runner }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            runner: macos-latest
          - target: x86_64-apple-darwin
            platform: darwin-x64
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
          --filter "@zealamic/*..." --filter "."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Add macOS x64 Rust target
        if: matrix.settings.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: release-${{ matrix.settings.target }}
          cache-on-failure: true

      - name: Install Zig and cargo-zigbuild for musl
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          pipx install ziglang
          pipx install cargo-zigbuild
          pipx ensurepath
          export PATH="$HOME/.local/bin:$PATH"
          sudo ln -sf "$(which python-zig)" /usr/local/bin/zig
          zig version
          cargo-zigbuild --version

      - name: Expose Node and Rust tools on system PATH
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          for tool in node pnpm cargo rustc rustup; do
            tool_path="$(command -v "$tool" || true)"
            if [ -n "$tool_path" ]; then
              sudo ln -sf "$tool_path" "/usr/local/bin/$tool"
            fi
          done

      - name: Build native binding (musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        shell: bash
        env:
          PATH: /home/runner/.local/bin:/home/runner/.cargo/bin:/home/runner/setup-pnpm/node_modules/.bin:/usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          zig version
          pnpm --filter @zealamic/css-doctor-binding build \
            --target "${{ matrix.settings.target }}" \
            --zig

      - name: Build native binding (non-musl)
        if: matrix.settings.target != 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @zealamic/css-doctor-binding build \
            --target "${{ matrix.settings.target }}"

      - name: Verify native output
        shell: bash
        run: |
          set -euo pipefail
          ls -la packages/binding/*.node

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.settings.target }}
          path: packages/binding/*.node
          if-no-files-found: error
          retention-days: 14

  bundle-release-artifacts:
    name: Bundle release artifacts
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
          --filter "@zealamic/*..." --filter "."

      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binding-*
          path: native-binaries
          merge-multiple: true

      - name: Stage native platform sub-packages
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Downloaded native artifact files"
          find native-binaries -maxdepth 3 -type f -print | sort || true
          echo "::endgroup::"

          version=$(node -p "require('./packages/binding/package.json').version")

          targets=(
            "aarch64-apple-darwin"
            "x86_64-apple-darwin"
            "x86_64-unknown-linux-gnu"
            "x86_64-unknown-linux-musl"
            "x86_64-pc-windows-msvc"
          )

          platforms=(
            "darwin-arm64"
            "darwin-x64"
            "linux-x64-gnu"
            "linux-x64-musl"
            "win32-x64-msvc"
          )

          for index in "${!targets[@]}"; do
            target="${targets[$index]}"
            platform="${platforms[$index]}"
            package_dir="packages/binding/npm/css-doctor-binding-${platform}"
            binary="${package_dir}/css-doctor-binding.${platform}.node"

            mkdir -p "${package_dir}"

            artifact=$(find native-binaries -maxdepth 1 -type f -name "*.${platform}.node" -print -quit)

            if [ -z "${artifact}" ]; then
              artifact=$(find native-binaries -maxdepth 1 -type f -name "*${platform}*.node" -print -quit)
            fi

            if [ -z "${artifact}" ]; then
              echo "::error::Missing native binary for target ${target} (expected filename containing ${platform})"
              exit 1
            fi

            echo "Staging ${artifact} -> ${binary}"
            cp "${artifact}" "${binary}"

            case "${platform}" in
              darwin-*)
                os_name="darwin"
                cpu_name="${platform#darwin-}"
                ;;
              linux-*)
                os_name="linux"
                cpu_name="x64"
                ;;
              win32-*)
                os_name="win32"
                cpu_name="x64"
                ;;
              *)
                echo "Unsupported platform: ${platform}" >&2
                exit 1
                ;;
            esac

            cat > "${package_dir}/package.json" <<JSON
          {
            "name": "@zealamic/css-doctor-binding-${platform}",
            "version": "${version}",
            "description": "Prebuilt css-doctor native binding for ${platform}",
            "license": "MIT",
            "main": "css-doctor-binding.${platform}.node",
            "files": [
              "css-doctor-binding.${platform}.node"
            ],
            "os": [
              "${os_name}"
            ],
            "cpu": [
              "${cpu_name}"
            ],
            "publishConfig": {
              "access": "public"
            }
          }
          JSON
          done

          staged_count=$(find packages/binding/npm -type f -name '*.node' | wc -l | tr -d ' ')
          echo "::group::Staged native binaries"
          find packages/binding/npm -type f -name '*.node' -print | sort
          echo "Staged .node count: ${staged_count} (expected 5)"
          echo "::endgroup::"

          if [ "${staged_count}" -ne 5 ]; then
            echo "::error::Expected 5 staged native binaries, found ${staged_count}"
            exit 1
          fi

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Build all packages
        run: pnpm build

      - name: Verify package outputs
        shell: bash
        run: |
          set -uo pipefail
          missing=0

          echo "::group::packages/binding top-level files"
          ls -la packages/binding || true
          echo "::endgroup::"

          echo "::group::packages/binding/npm tree"
          find packages/binding/npm -maxdepth 3 -type f -print 2>/dev/null | sort || true
          echo "::endgroup::"

          if [ ! -f packages/binding/index.js ]; then
            echo "::error::Missing packages/binding/index.js"
            missing=1
          else
            echo "Found packages/binding/index.js"
          fi

          if [ ! -f packages/binding/index.d.ts ]; then
            echo "::error::Missing packages/binding/index.d.ts"
            missing=1
          else
            echo "Found packages/binding/index.d.ts"
          fi

          platforms=(
            "darwin-arm64"
            "darwin-x64"
            "linux-x64-gnu"
            "linux-x64-musl"
            "win32-x64-msvc"
          )

          for platform in "${platforms[@]}"; do
            package_dir="packages/binding/npm/css-doctor-binding-${platform}"
            binary="${package_dir}/css-doctor-binding.${platform}.node"

            if [ ! -d "${package_dir}" ]; then
              echo "::error::Missing platform package directory: ${package_dir}"
              missing=1
            elif [ ! -f "${binary}" ]; then
              echo "::error::Missing native binary: ${binary}"
              missing=1
            else
              echo "Verified ${binary}"
            fi

            if [ ! -f "${package_dir}/package.json" ]; then
              echo "::error::Missing platform package manifest: ${package_dir}/package.json"
              missing=1
            fi
          done

          echo "::group::Package dist outputs"
          for package_dir in packages/*; do
            if [ ! -d "${package_dir}/dist" ]; then
              echo "No dist directory: ${package_dir}"
              continue
            fi

            echo "--- ${package_dir}/dist ---"
            ls -la "${package_dir}/dist" || true

            if [ ! -f "${package_dir}/dist/index.js" ]; then
              echo "::error::Missing ${package_dir}/dist/index.js"
              missing=1
            fi

            # The CLI is an executable package; it has no public type declarations.
            if [ "${package_dir}" != "packages/cli" ] && [ ! -f "${package_dir}/dist/index.d.ts" ]; then
              echo "::error::Missing ${package_dir}/dist/index.d.ts"
              missing=1
            fi
          done
          echo "::endgroup::"

          node_count=$(find packages/binding/npm -type f -name '*.node' | wc -l | tr -d ' ')
          echo "::group::Native binary count"
          echo "Found ${node_count} .node files (expected 5)"
          find packages/binding/npm -type f -name '*.node' -print | sort || true
          echo "::endgroup::"

          if [ "${node_count}" -ne 5 ]; then
            echo "::error::Expected 5 native .node files, found ${node_count}"
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            echo "::error::Release artifact verification failed; see the errors above."
            exit 1
          fi

          echo "All release artifacts verified: 5 platform binaries and all dist declarations are present."

      - name: Prepare publishable manifests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          for (const entry of fs.readdirSync("packages", { withFileTypes: true })) {
            if (!entry.isDirectory() || entry.name === "binding") {
              continue;
            }

            const manifestPath = path.join("packages", entry.name, "package.json");

            if (!fs.existsSync(manifestPath)) {
              continue;
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            delete manifest.private;
            manifest.publishConfig = manifest.publishConfig ?? {};
            manifest.publishConfig.access = "public";
            fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
            console.log(`Prepared ${manifest.name}@${manifest.version} for publishing`);
          }

          const bindingPath = "packages/binding/package.json";
          const binding = JSON.parse(fs.readFileSync(bindingPath, "utf8"));
          delete binding.private;
          binding.publishConfig = binding.publishConfig ?? {};
          binding.publishConfig.access = "public";
          fs.writeFileSync(bindingPath, `${JSON.stringify(binding, null, 2)}\n`);
          console.log(`Prepared ${binding.name}@${binding.version} for publishing`);
          NODE

      - name: Create ready-to-publish packages archive
        shell: bash
        run: |
          set -euo pipefail
          rm -f ready-to-publish-packages.zip
          zip -rq ready-to-publish-packages.zip packages
          unzip -l ready-to-publish-packages.zip | tail -20
          ls -lh ready-to-publish-packages.zip

      - name: Upload ready-to-publish packages
        uses: actions/upload-artifact@v4
        with:
          name: ready-to-publish-packages
          path: ready-to-publish-packages.zip
          if-no-files-found: error
          retention-days: 30

      - name: Write maintainer instructions
        run: |
          {
            echo "## Ready-to-publish packages"
            echo ""
            echo "The release bundle is ready. No registry publishing was executed."
            echo ""
            echo "Maintainer steps:"
            echo ""
            echo "1. Open the Actions tab, select this successful run, and download the ready-to-publish-packages artifact."
            echo "2. Unzip it over the packages/ directory in the monorepo."
            echo "3. Log in to npm locally."
            echo "4. Run: pnpm -r publish --access public --no-git-checks"
            echo ""
            echo "The artifact contains five platform .node binaries under packages/binding/npm and all adapter dist directories."
          } >> "$GITHUB_STEP_SUMMARY"
